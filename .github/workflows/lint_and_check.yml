name: Lint and Check R Code

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Setup renv
        uses: r-lib/actions/setup-renv@v2

      - name: Install lintr
        run: |
          install.packages(c("lintr"))
        shell: Rscript {0}

      - name: Check renv status
        run: |
          # Fails if renv.lock is out of sync with library/dependencies
          renv::status()
        shell: Rscript {0}

      - name: Run lintr
        run: |
          lints <- lintr::lint_dir("src")
          print(lints)

          # Fail the GitHub Action if any lints are found
          if (length(lints) > 0) {
            stop("Linting errors found. Please fix them!")
          }
        shell: Rscript {0}
